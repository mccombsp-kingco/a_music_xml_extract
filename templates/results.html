<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 3.2//EN">
<HTML>
<HEAD>
  <TITLE>Glittering Caves Music Data</TITLE>
  <link rel="stylesheet" href="{{ url_for('static', filename='flask.css') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}"
</HEAD>
<BODY>
  <div class="banner">
    <H1>This is not a test!</H1>
  </div>
  <div class="item">
    <h2>Menu</h2>
    <p style="white-space: pre-wrap;">{{ menu_text }}</p>
  </div>
  <div class="item">
    <h2>Search for Tracks</h2>
    <form action='/results' method='post'>
      <input type="radio" id="artist" name="option" value="1">
      <label for="artist">Artist Name</label>
      <input type="radio" id="song" name="option" value="2">
      <label for="song">Song Title</label>
      <input type="radio" id="album" name="option" value="3">
      <label for="album">Album Title</label>
      <br>
      <label>Search String:</label>
      <input name="searchfor" type="text" required>
      <br>
      <input type="submit">
    </form>
  </div>
  <div class="terminal">
    <h2> Output</h2>
    <pre>{{ output_text }}</pre>
  </div>
  <div class="banner">
    v 0.2
    Updated: <em>2026/02/17</em>
  </div>
</BODY>

</HTML>
